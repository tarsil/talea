---
name: Test Suite

on:
  push:
    branches:
      - "main"
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  tests:
    name: "Python release gates"
    runs-on: "ubuntu-latest"

    strategy:
      matrix:
        python-version: ["3.14", "3.15"]

    steps:
      - uses: "actions/checkout@v7"
      - uses: "actions/setup-python@v7"
        with:
          python-version: "${{ matrix.python-version }}"
          allow-prereleases: true
      - name: "Install dependencies"
        run: "python -m pip install hatch"
      - name: "Run linting checks"
        run: "hatch run ruff check --line-length 99 talea tests benchmarks docs_src scripts/docs_check.py"
      - name: "Run formatting checks"
        run: "hatch fmt --check"
      - name: "Prove quality checks did not mutate sources"
        run: "git diff --exit-code"
      - name: "Run typing checks"
        if: "matrix.python-version == '3.14'"
        run: "hatch run test:check_types"
      - name: "Run tests"
        run: "hatch run test:test"
      - name: "Enforce 100% coverage"
        if: "matrix.python-version == '3.14'"
        run: "hatch run test:coverage"
      - name: "Execute documentation examples and integrity checks"
        run: "hatch run docs:test"
      - name: "Build documentation"
        run: "hatch run docs:build"
      - name: "Build and check wheel and sdist"
        run: "hatch run build_with_check"
      - name: "Prove release gates left committed sources unchanged"
        run: "git diff --exit-code"
