site_name: Talea
site_description: Modern Python data contracts with strict validation, serialization, and JSON Schema.
site_url: https://talea.tarsild.io
docs_dir: docs/generated
site_dir: site
theme:
  name: material
  language: en
  icon:
    logo: lucide/sparkles
  palette:
    - scheme: default
      media: '(prefers-color-scheme: light)'
      toggle:
        icon: lucide/sun
        name: Switch to dark mode
    - scheme: slate
      media: '(prefers-color-scheme: dark)'
      toggle:
        icon: lucide/moon
        name: Switch to light mode
  favicon: statics/images/favicon.ico
  logo: statics/images/black.png
  features:
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - navigation.indexes
    - navigation.path
    - navigation.tabs

repo_name: tarsil/talea
repo_url: https://github.com/tarsil/talea
edit_uri: ""
extra_css:
  - stylesheets/extra.css
plugins:
  - search
  - meta-descriptions:
      export_csv: false
      quiet: false
      enable_checks: false
      min_length: 50
      max_length: 160
      trim: false

nav:
  - Introduction: "index.md"
  - Getting Started:
      - "getting-started/index.md"
      - Why Talea?: "getting-started/why-talea.md"
      - Installation: "getting-started/installation.md"
      - Five-minute quickstart: "getting-started/quickstart.md"
      - Tutorial: "getting-started/tutorial.md"
      - Production service boundary: "getting-started/production-service.md"
  - Concepts:
      - "concepts/index.md"
      - Mental model: "concepts/mental-model.md"
      - Specs: "concepts/specs.md"
      - Contracts: "contracts.md"
      - Strictness and boundaries: "concepts/strictness-boundaries.md"
      - Composition and inheritance: "composition-inheritance.md"
      - Generics and recursion: "recursive-generics.md"
      - Tagged unions: "tagged-unions.md"
      - Derived and PATCH contracts: "presence-derived-contracts.md"
  - How-to Guides:
      - "guides/index.md"
      - Recipes: "guides/recipes.md"
      - Adoption and migration: "guides/adoption.md"
  - Reference:
      - "reference/index.md"
      - Fields and defaults: "field-semantics.md"
      - Supported types: "supported-types.md"
      - Constraints: "constraints.md"
      - Transforms and checks: "custom-validation.md"
      - Input boundaries: "input-boundaries.md"
      - Serialization: "serialization.md"
      - Validation errors: "error-experience.md"
      - Metadata and Sensitive: "metadata-security.md"
      - JSON Schema and OpenAPI: "json-schema-openapi.md"
      - ResourcePolicy: "resource-security.md"
      - Typing: "reference/typing.md"
      - Introspection: "reference/introspection.md"
      - Dynamic Specs: "dynamic-utilities.md"
      - Immutable updates: "reference/immutable-updates.md"
      - Edge cases: "reference/edge-cases.md"
      - Public API: "reference/api.md"
  - Engineering:
      - "engineering/index.md"
      - Architecture: "engineering/architecture.md"
      - Security architecture: "engineering/security.md"
      - Performance: "engineering/performance.md"
      - Enterprise evaluation: "engineering/enterprise-evaluation.md"
      - Comparison: "engineering/comparison.md"
      - Known limitations: "engineering/limitations.md"
      - Troubleshooting: "engineering/troubleshooting.md"
  - Project:
      - Contributing: "contributing.md"
      - Version, maturity, and support: "release-ledger.md"
      - Release notes: "release-notes.md"
      - Sponsorship: "sponsorship.md"

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.highlight:
      use_pygments: true
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html

extra:
  alternate:
    - link: /
      name: English
      lang: en
