[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "talea"
description = "A fast and light Python validation library of the future"
readme = "README.md"
requires-python = ">=3.14"
dynamic = ['version']
license = "MIT"
authors = [
    { name = "Tiago Silva", email = "tiago.arasilva@gmail.com" },
]
classifiers = [
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
    "Typing :: Typed",
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Framework :: AnyIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = []
keywords = ["talea"]

[project.urls]
Homepage = "https://github.com/tarsil/talea"
Documentation = "https://talea.tarsild.io"
Changelog = "https://talea.tarsild.io/release-notes/"
Funding = "https://github.com/sponsors/tarsil"
Source = "https://github.com/tarsil/talea"


[tool.hatch.version]
path = "talea/__init__.py"

[tool.hatch.envs.default]
dependencies = [
    "ty==0.0.72",
    "ruff>=0.3.0,<5.0.0",
    "pre-commit>=3.3.1,<4.0.0",
    "devtools>=0.12.2",
    "ipython",
    "ptpython",
    "twine",
]

[project.optional-dependencies]
testing = [
    "autoflake>=2.0.2,<3.0.0",
    "black==24.1.1,<25.0",
    "isort>=5.12.0,<6.0.0",
    "pytest>=7.2.2,<9.0.0",
    "pytest-cov>=4.0.0,<5.0.0",
    "hypothesis>=6.0,<7.0",
    "zensical>=0.0.23,<0.1.0",
]
benchmarking = [
    "msgspec>=0.20.0,<1.0.0",
    "pydantic>=2.12.0,<3.0.0",
]

[tool.hatch.envs.default.scripts]
clean_pyc = "find . -type f -name \"*.pyc\" -delete"
clean_pyi = "find . -type f -name \"*.pyi\" -delete"
clean_pycache = "find . -type d -name \"*__pycache__*\" -delete"
build_with_check = "hatch build; twine check dist/*"
lint = "ruff check --fix --line-length 99 talea tests benchmarks {args}"
format = "hatch fmt && hatch fmt --check && hatch run test:check_types"

[tool.hatch.envs.docs]
dependencies = [
    "sayer",
    "griffe-typingdoc>=0.2.2,<1.0",
    "mdx-include>=1.4.2",
    "zensical>=0.0.23,<0.1.0",
    "pyyaml>=6.0,<7.0.0",
]

[tool.hatch.envs.docs.scripts]
prepare = "scripts/docs.py prepare"
clean = "scripts/docs.py clean"
build = "scripts/docs.py build --clean"
serve = "scripts/docs.py serve"
dev = "scripts/docs.py serve"

[tool.hatch.envs.test]
features = ["testing", "benchmarking"]

[tool.hatch.envs.hatch-test]
extra-dependencies = ["hypothesis>=6.0,<7.0"]

[tool.hatch.envs.test.scripts]
test = "hatch test -- {args}"
test_man = "hatch test -- {args} -s -vv"
coverage = "pytest --cov=talea --cov-report=term-missing {args}"
check_types = "ty check talea benchmarks typing_contracts"
benchmark_schema = "python benchmarks/schema_resolution.py"
benchmark_spec = "python benchmarks/spec_construction.py"
benchmark_composition = "python benchmarks/spec_composition.py"
benchmark_validator = "python benchmarks/validator_compilation.py"
benchmark_types = "python benchmarks/type_constraints.py"
benchmark_hooks = "python benchmarks/custom_validation.py"
benchmark_errors = "python benchmarks/error_experience.py"
benchmark_mapping = "python benchmarks/input_boundaries.py mapping"
benchmark_json = "python benchmarks/input_boundaries.py json"
benchmark_serialization = "python benchmarks/serialization.py"
benchmark_recursive_generics = "python benchmarks/recursive_generics.py"
benchmark_utilities = "python benchmarks/utilities.py"
benchmark_metadata = "python benchmarks/metadata_security.py"
benchmark_tagged = "python benchmarks/tagged_unions.py"

[tool.isort]
profile = "black"
known_third_party = []
src_paths = ["talea"]

[tool.ty]

[tool.ty.environment]
python-version = "3.14"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "C", "B", "I"]
ignore = ["E501", "B008", "C901", "B026"]

exclude = ["docs_src/"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.coverage.run]
parallel = true
context = '${CONTEXT}'
source = ["tests", "talea"]
# omit = []

[tool.coverage.report]
fail_under = 100

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
xfail_strict = true
junit_family = "xunit2"

[tool.hatch.build.targets.sdist]
include = ["/talea"]
